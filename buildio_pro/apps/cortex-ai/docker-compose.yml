services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cortex_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex_ai}
      POSTGRES_DB: ${POSTGRES_DB:-cortex_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex_ai} -d ${POSTGRES_DB:-cortex_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8
    container_name: cortex_ai_valkey
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  valkey_data:
